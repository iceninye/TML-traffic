# Runs the checks on every pull request and every push to main.
name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Data
        run: |
          node tools/validate_data.mjs
          node tools/validate_calendar.mjs
      - name: Duty cards and hours
        run: |
          node tools/validate_duties.mjs
          node tools/validate-hours.mjs
          node tools/validate-duty-codes.mjs
      - name: Train matching and feed
        run: |
          node tools/validate_matching.mjs
          node tools/validate_replay.mjs
          node tools/validate_headway.mjs
          node tools/validate_position.mjs
          node tools/validate_lagstats.mjs
          node tools/validate_feed_errors.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python tools still load
        run: |
          pip install -r requirements.txt
          python -m py_compile tools/*.py
          python tools/update.py --check
      - name: Parse every script
        run: |
          for f in assets/*.js lib/*.js sw.js; do node --input-type=module --check < "$f" || { echo "syntax error in $f"; exit 1; }; done
