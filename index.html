<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0b0f14">
<meta name="description" content="屯馬綫列車動態圖 — 由港鐵公開到站倒數推算列車位置，27 站實時班次。Tuen Ma Line live train diagram, estimated from MTR arrival countdowns.">
<title>屯馬綫列車動態圖 · Tuen Ma Line Live</title>
<link rel="stylesheet" href="assets/app.css">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
</head>
<body>
<div class="app">

  <header class="top">
    <div class="top-row">
      <div class="brand">
        <span class="brand-dot" aria-hidden="true"></span>
        <div class="brand-text">
          <h1 id="title">屯馬綫列車動態圖</h1>
          <small id="sub">Tuen Ma Line · 實時推算</small>
        </div>
      </div>
      <div class="clock" id="clock"><b>--:--:--</b><span>HKT</span></div>
    </div>

    <div class="status">
      <span class="pulse" id="pulse" data-state="loading" aria-hidden="true"></span>
      <span id="status-text">載入中…</span>
      <span class="sep" aria-hidden="true">·</span>
      <span id="status-counts"></span>
    </div>
    <div class="period" id="period" data-peak="0"></div>

    <div class="controls">
      <div class="seg" id="view-seg" role="group" aria-label="視圖 / View">
        <button type="button" data-view="diagram" aria-pressed="true">路綫圖</button>
        <button type="button" data-view="map" aria-pressed="false">地圖</button>
      </div>
      <div class="seg" id="lang-seg" role="group" aria-label="語言 / Language">
        <button type="button" data-lang="tc" aria-pressed="true">繁</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
      <span class="spacer"></span>
      <button type="button" class="btn" id="pause-btn" aria-pressed="false">暫停</button>
    </div>

    <div class="col-legend" id="col-legend" data-show="1"></div>
  </header>

  <div class="alert" id="alert" role="status"></div>

  <main class="stage" id="stage">
    <section class="pane" id="pane-diagram" data-active="1">
      <div class="diagram-wrap" id="diagram-wrap">
        <svg class="diagram" id="diagram" viewBox="0 0 360 2000" role="group" aria-label="屯馬綫 27 站雙軌動態路綫圖"></svg>
      </div>
    </section>

    <section class="pane" id="pane-map" data-active="0">
      <div class="map-wrap">
        <div id="map"></div>
        <div class="map-legend" id="map-legend"></div>
        <div class="map-note" id="map-note">載入地圖…</div>
      </div>
    </section>

    <div class="map-fallback" id="map-fallback">
      <p>地圖開唔到，已自動轉回路綫圖。</p>
    </div>
  </main>

  <footer class="foot" id="foot"></footer>
</div>

<div class="sheet-backdrop" id="sheet-backdrop"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="詳細資料">
  <div class="sheet-grip" aria-hidden="true"></div>
  <div id="sheet-body"></div>
</div>

<noscript>
  <p style="padding:16px">此頁需要 JavaScript。This page needs JavaScript.</p>
</noscript>

<script type="module" src="assets/app.js"></script>
</body>
</html>
